<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worldbuilder Encyclopedia</title>
<link data-fonts rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style id="style">
:root {
  --parch: #f3e8cf;
  --parch-2: #eadbb8;
  --parch-3: #dcc79a;
  --ink: #3a2a1a;
  --ink-soft: #6b5640;
  --blood: #7a1f1f;
  --gold: #a67c2e;
  --line: #c9b184;
  --card: #f8f0dc;
  --shadow: 0 2px 10px rgba(60, 40, 15, .18);
  --head: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --body: 'EB Garamond', Garamond, Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--body);
  font-size: 18px;
  color: var(--ink);
  background: #e4d3ab;
  background-image:
    radial-gradient(ellipse at top left, rgba(255,250,235,.7), transparent 60%),
    radial-gradient(ellipse at bottom right, rgba(120,80,30,.25), transparent 70%);
  background-attachment: fixed;
  min-height: 100vh;
}
a { color: var(--blood); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { font-family: var(--head); font-weight: 700; color: var(--ink); letter-spacing: .03em; }
button, .btn, select, input, textarea { font-family: var(--body); font-size: 17px; }
button, .btn {
  background: var(--parch-2); color: var(--ink); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 12px; cursor: pointer; display: inline-block; line-height: 1.2;
}
button:hover, .btn:hover { background: var(--parch-3); text-decoration: none; }
button.primary, .btn.primary { background: var(--blood); color: #fbefd9; border-color: #5a1515; }
button.primary:hover { background: #8f2727; }
button.danger { color: var(--blood); border-color: var(--blood); background: transparent; }
input, select, textarea {
  width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px;
  background: #fffaf0; color: var(--ink);
}
textarea { resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 0; }

/* Layout */
#app { display: grid; grid-template-columns: 290px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }
header.top {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 20px; background: #3a2a1a; color: #f3e8cf;
  border-bottom: 4px double var(--gold);
}
header.top .brand { font-family: var(--head); font-size: 22px; color: #f3e8cf; flex: 1; min-width: 180px; }
header.top .brand small { display: block; font-family: var(--body); font-style: italic; font-size: 14px; color: #cdb88d; letter-spacing: 0; }
header.top nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
header.top nav a, header.top nav summary, header.top nav button {
  color: #f3e8cf; background: transparent; border: 1px solid #6b5640; padding: 5px 11px; border-radius: 4px;
  font-family: var(--head); font-size: 14px; cursor: pointer; list-style: none;
}
header.top nav a:hover, header.top nav summary:hover, header.top nav button:hover { background: #5a4228; text-decoration: none; }
header.top nav a.active { background: var(--gold); color: #2b1d0e; border-color: var(--gold); }
details.menu { position: relative; }
details.menu summary::-webkit-details-marker { display: none; }
details.menu .menu-pop {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 50; min-width: 250px;
  background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 6px;
}
details.menu .menu-pop button { display: block; width: 100%; text-align: left; margin: 2px 0; color: var(--ink); font-family: var(--body); font-size: 16px; border: none; background: transparent; }
details.menu .menu-pop button:hover { background: var(--parch-2); }
.save-state { font-size: 13px; color: #cdb88d; font-style: italic; min-width: 60px; }
#menu-toggle { display: none; }

aside.side {
  background: rgba(234, 219, 184, .75); border-right: 1px solid var(--line);
  padding: 14px; overflow-y: auto; max-height: calc(100vh - 60px); position: sticky; top: 0;
}
aside.side .search { margin-bottom: 10px; }
aside.side h4 { font-size: 13px; margin: 16px 0 6px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .12em; }
.type-list a { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-radius: 4px; color: var(--ink); }
.type-list a:hover, .type-list a.active { background: var(--parch-3); text-decoration: none; }
.type-list .count { font-size: 14px; color: var(--ink-soft); }
.entry-list a { display: block; padding: 3px 8px 3px 14px; color: var(--ink); border-left: 3px solid transparent; font-size: 16px; }
.entry-list a:hover { background: var(--parch-3); text-decoration: none; }
.entry-list a.active { border-left-color: var(--blood); background: var(--parch-3); }
.entry-list .group { font-family: var(--head); font-size: 13px; margin: 10px 0 2px; color: var(--ink-soft); }
.tag-cloud { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  display: inline-block; font-size: 14px; padding: 1px 9px; border-radius: 12px;
  background: var(--parch); border: 1px solid var(--line); color: var(--ink-soft);
}
a.tag:hover, a.tag.active { background: var(--blood); color: #fbefd9; border-color: var(--blood); text-decoration: none; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

main#main { padding: 26px 34px 80px; min-width: 0; }
.page {
  max-width: 1050px; margin: 0 auto; background: var(--card);
  border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 3px; padding: 30px 38px;
  position: relative;
}
.page::before {
  content: ""; position: absolute; inset: 6px; border: 1px solid rgba(166,124,46,.35); pointer-events: none; border-radius: 2px;
}
.page h1 { font-size: 36px; margin: 0 0 4px; }
.page h2 { font-size: 26px; margin: 0 0 14px; }
.page .lede { font-style: italic; color: var(--ink-soft); font-size: 20px; margin: 0 0 18px; }
.divider { text-align: center; color: var(--gold); margin: 22px 0; letter-spacing: .5em; }
.hint { color: var(--ink-soft); font-style: italic; font-size: 15px; }
.empty { text-align: center; padding: 30px; color: var(--ink-soft); font-style: italic; }

/* Home */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin: 16px 0; }
.stat {
  display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--parch);
  color: var(--ink); border-top: 4px solid var(--c, var(--gold));
}
.stat:hover { background: var(--parch-2); text-decoration: none; }
.stat .n { font-family: var(--head); font-size: 26px; display: block; }
.stat .l { font-size: 15px; color: var(--ink-soft); }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card {
  display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 4px; background: var(--parch);
  color: var(--ink); overflow: hidden; border-top: 4px solid var(--c, var(--gold));
}
.card:hover { box-shadow: var(--shadow); text-decoration: none; transform: translateY(-1px); }
.card img { width: 100%; height: 140px; object-fit: cover; border-bottom: 1px solid var(--line); }
.card .body { padding: 10px 12px; }
.card .t { font-family: var(--head); font-size: 17px; display: block; }
.card .s { font-size: 15px; color: var(--ink-soft); }

/* Entry */
.entry-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.badge {
  display: inline-block; font-family: var(--head); font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 9px; border-radius: 3px; color: #fbefd9; background: var(--c, var(--gold));
}
.entry-grid { display: grid; grid-template-columns: 1fr 290px; gap: 28px; margin-top: 14px; }
.infobox { border: 1px solid var(--line); background: var(--parch); border-radius: 3px; align-self: start; font-size: 16px; }
.infobox .ib-title { font-family: var(--head); text-align: center; padding: 8px; background: var(--c, var(--gold)); color: #fbefd9; }
.infobox img { width: 100%; display: block; border-bottom: 1px solid var(--line); cursor: zoom-in; }
.infobox table { width: 100%; border-collapse: collapse; }
.infobox th, .infobox td { padding: 6px 10px; border-top: 1px solid var(--line); vertical-align: top; text-align: left; }
.infobox th { width: 42%; font-weight: 600; color: var(--ink-soft); }
.article { line-height: 1.6; }
.article p:first-child::first-letter {
  font-family: var(--head); float: left; font-size: 3.2em; line-height: .9; padding: 4px 8px 0 0; color: var(--blood);
}
.article blockquote { border-left: 3px solid var(--gold); margin: 12px 0; padding: 4px 16px; font-style: italic; color: var(--ink-soft); }
.article h3, .article h4 { margin: 22px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.rels { display: grid; gap: 4px; }
.rels li { list-style: none; }
.rels ul { padding: 0; margin: 0; }
.rel-label { color: var(--ink-soft); font-style: italic; }
.secret { border: 1px dashed var(--blood); background: rgba(122,31,31,.06); padding: 10px 14px; border-radius: 4px; margin-top: 18px; }
.secret h4 { margin: 0 0 6px; color: var(--blood); font-size: 14px; }
.entry-actions { display: flex; gap: 8px; }

/* Forms */
form.edit label { display: block; margin: 12px 0; font-weight: 600; }
form.edit label > input, form.edit label > select, form.edit label > textarea { margin-top: 4px; font-weight: 400; }
form.edit fieldset { border: 1px solid var(--line); border-radius: 4px; padding: 6px 16px 12px; margin: 18px 0; }
form.edit legend { font-family: var(--head); padding: 0 8px; color: var(--ink-soft); }
.field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 16px; }
.row { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; margin: 6px 0; align-items: center; }
.era-row { display: grid; grid-template-columns: 1.6fr 1fr 1fr 60px auto; gap: 8px; margin: 6px 0; align-items: center; }
.era-row input[type=color] { padding: 2px; height: 36px; }
.img-edit { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.img-edit img { max-width: 160px; max-height: 120px; border: 1px solid var(--line); border-radius: 3px; }
.form-actions { display: flex; gap: 10px; margin-top: 20px; position: sticky; bottom: 0; background: var(--card); padding: 10px 0; border-top: 1px solid var(--line); }

/* Timeline */
.tl-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.tl-filters label { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--parch); cursor: pointer; }
.tl-filters input { width: auto; }
.timeline { position: relative; padding-left: 110px; }
.timeline::before { content: ""; position: absolute; left: 92px; top: 0; bottom: 0; width: 3px; background: var(--line); }
.tl-era {
  margin: 22px 0 12px -110px; padding: 8px 14px; font-family: var(--head); font-size: 18px; color: #fbefd9;
  background: var(--c, var(--ink-soft)); border-radius: 3px; position: relative; z-index: 1;
}
.tl-era small { font-family: var(--body); font-style: italic; opacity: .85; margin-left: 8px; font-size: 15px; }
.tl-ev { position: relative; margin: 10px 0; }
.tl-ev .yr { position: absolute; left: -110px; width: 80px; text-align: right; font-family: var(--head); font-size: 14px; top: 9px; color: var(--ink-soft); }
.tl-ev::before {
  content: ""; position: absolute; left: -24px; top: 12px; width: 13px; height: 13px; border-radius: 50%;
  background: var(--c, var(--gold)); border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line);
}
.tl-ev .box { background: var(--parch); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--gold)); border-radius: 3px; padding: 7px 12px; }
.tl-ev .box .what { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }

/* Graph */
.graph-wrap { border: 1px solid var(--line); border-radius: 4px; background: #fbf4e2; overflow: hidden; }
svg#graph { width: 100%; height: 620px; display: block; cursor: grab; touch-action: none; }
svg#graph .edge { stroke: #9c8559; stroke-width: 1.4; }
svg#graph .elabel { font-size: 11px; fill: var(--ink-soft); font-style: italic; pointer-events: none; }
svg#graph .node circle { stroke: #fbf4e2; stroke-width: 2.5; cursor: pointer; }
svg#graph .node text { font-family: var(--head); font-size: 12px; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: #fbf4e2; stroke-width: 3px; }
svg#graph .node:hover circle { stroke: var(--blood); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 15px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; }
.toolbar input[type=checkbox] { width: auto; }

/* Lightbox */
#lightbox { position: fixed; inset: 0; background: rgba(20,12,4,.85); display: none; align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
#lightbox.open { display: flex; }
#lightbox img { max-width: 94vw; max-height: 94vh; border: 6px solid var(--parch); }

#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--parch);
  padding: 10px 18px; border-radius: 4px; box-shadow: var(--shadow); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 120;
}
#toast.show { opacity: 1; }

body.readonly [data-edit] { display: none !important; }

@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; }
  aside.side { display: none; position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--line); }
  #app.side-open aside.side { display: block; }
  #menu-toggle { display: inline-block; }
  main#main { padding: 14px 12px 60px; }
  .page { padding: 20px 18px; }
  .entry-grid { grid-template-columns: 1fr; }
  .infobox { order: -1; }
  .timeline { padding-left: 76px; }
  .timeline::before { left: 60px; }
  .tl-era { margin-left: -76px; }
  .tl-ev .yr { left: -78px; width: 52px; font-size: 12px; }
  .row, .era-row { grid-template-columns: 1fr; }
}
@media print {
  header.top, aside.side, .entry-actions { display: none !important; }
  #app { display: block; }
  .page { box-shadow: none; border: none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="menu-toggle" type="button" aria-label="Toggle index">☰</button>
    <a class="brand" href="#/home"><span id="brand-name">Worldbuilder</span><small id="brand-tag">An Encyclopedia of Worlds</small></a>
    <nav>
      <a href="#/home" data-nav="home">Codex</a>
      <a href="#/timeline" data-nav="timeline">Timeline</a>
      <a href="#/graph" data-nav="graph">Web</a>
      <details class="menu" data-edit>
        <summary>+ New</summary>
        <div class="menu-pop" id="new-menu"></div>
      </details>
      <details class="menu" data-edit>
        <summary>Export ▾</summary>
        <div class="menu-pop">
          <button type="button" data-act="save-folder">📁 Save both to builder folder…</button>
          <button type="button" data-act="export-json">⬇ Download world file (.json)</button>
          <button type="button" data-act="export-html">⬇ Download encyclopedia (.html)</button>
          <button type="button" data-act="import">⬆ Import world file…</button>
        </div>
      </details>
      <a href="#/settings" data-nav="settings" data-edit>⚙ World</a>
      <span class="save-state" id="save-state" data-edit></span>
    </nav>
  </header>
  <aside class="side">
    <input class="search" id="search" type="search" placeholder="Search the codex…" autocomplete="off">
    <div id="side-content"></div>
  </aside>
  <main id="main"></main>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <div id="lightbox"><img alt=""></div>
  <div id="toast"></div>
</div>

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const isNum = v => v !== '' && v != null && !isNaN(Number(v));
const byId = id => world.entries.find(e => e.id === id);
const slug = s => (s || 'world').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'world';

function fmtYear(y) {
  if (!isNum(y)) return '';
  y = Number(y);
  const c = world.calendar || {};
  if (y < 0) return `${Math.abs(y)} ${c.before || 'BE'}`.trim();
  return `${y} ${c.suffix || ''}`.trim();
}
function eraFor(y) {
  return (world.eras || []).find(er => isNum(er.start) && y >= Number(er.start) && (!isNum(er.end) || y <= Number(er.end)));
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}

function md(src) {
  if (!src) return '';
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
  const out = []; let para = [], list = [], quote = [];
  const flush = () => {
    if (para.length) out.push(`<p>${inline(para.join(' '))}</p>`);
    if (list.length) out.push(`<ul>${list.map(li => `<li>${inline(li)}</li>`).join('')}</ul>`);
    if (quote.length) out.push(`<blockquote>${inline(quote.join(' '))}</blockquote>`);
    para = []; list = []; quote = [];
  };
  for (const line of esc(src).split(/\r?\n/)) {
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flush(); out.push(m[1].length === 1 ? `<h3>${inline(m[2])}</h3>` : `<h4>${inline(m[2])}</h4>`); }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (para.length || quote.length) { const l = list; list = []; flush(); list = l; } list.push(m[1]); }
    else if ((m = line.match(/^&gt;\s?(.*)/))) { if (para.length || list.length) flush(); quote.push(m[1]); }
    else if (!line.trim()) flush();
    else { if (list.length || quote.length) flush(); para.push(line); }
  }
  flush();
  return out.join('');
}

function blankWorld() {
  return {
    format: 'worldbuilder', version: 1, name: 'Untitled World', tagline: 'An encyclopedia yet unwritten',
    overview: '', calendar: { suffix: 'AE', before: 'BE' }, eras: [], entries: [],
    created: Date.now(), updated: Date.now(),
  };
}
function normalize(w) {
  if (!w || typeof w !== 'object' || !Array.isArray(w.entries)) return null;
  const base = blankWorld();
  w = { ...base, ...w, calendar: { ...base.calendar, ...(w.calendar || {}) } };
  w.eras = Array.isArray(w.eras) ? w.eras : [];
  w.entries = w.entries.filter(e => e && e.id).map(e => ({
    type: TYPES[e.type] ? e.type : 'lore', title: 'Untitled', summary: '', body: '', image: '', secret: '',
    ...e, fields: e.fields || {}, tags: Array.isArray(e.tags) ? e.tags : [], relations: Array.isArray(e.relations) ? e.relations : [],
  }));
  return w;
}

// ---------- storage (IndexedDB with localStorage fallback) ----------
const store = {
  _db: null,
  open() {
    if (this._db) return this._db;
    this._db = new Promise((res, rej) => {
      const r = indexedDB.open('worldbuilder', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async get(k) {
    try {
      const db = await this.open();
      return await new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    } catch { try { return JSON.parse(localStorage.getItem('wb:' + k)); } catch { return null; } }
  },
  async set(k, v) {
    try {
      const db = await this.open();
      await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    } catch { localStorage.setItem('wb:' + k, JSON.stringify(v)); }
  },
};
let saveTimer;
function save() {
  if (READONLY) return;
  world.updated = Date.now();
  $('#save-state').textContent = 'saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await store.set('world', world); $('#save-state').textContent = 'saved ✓'; }
    catch (err) { $('#save-state').textContent = 'not saved!'; alert('Could not save to browser storage (' + err.message + '). Export your world to keep it safe.'); }
  }, 300);
}

  return [e.title, e.summary, e.body, e.tags.join(' '), Object.values(e.fields).join(' ')].join(' ').toLowerCase().includes(q);

function submitEdit(form) {

    fields, relations, updated: Date.now(),

function readImage(file, max) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Unreadable image'));
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.86));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// ---------- timeline ----------
function timelineEvents() {
  const ev = [];
  for (const e of world.entries) {
    for (const f of TYPES[e.type].fields) {
      if (!f.tl || !isNum(e.fields[f.k])) continue;
      const isMain = e.type === 'history' && f.k === 'start';
      ev.push({ year: Number(e.fields[f.k]), what: isMain ? TYPES.history.singular : f.tl, e });
    }
  }
  return ev.sort((a, b) => a.year - b.year || a.e.title.localeCompare(b.e.title));
}
function renderTimeline() {
  const all = timelineEvents();
  const ev = all.filter(x => !ui.tlHidden.has(x.e.type));
  let html = '', lastEra;
  for (const x of ev) {
    const era = eraFor(x.year) || null;
    if (era !== lastEra) {
      html += era
        ? `<div class="tl-era" style="--c:${esc(era.color || '#6b5640')}">${esc(era.name)}<small>${esc(fmtYear(era.start))}${isNum(era.end) ? ' – ' + esc(fmtYear(era.end)) : ' – present'}</small></div>`
        : `<div class="tl-era">Unnamed age</div>`;
      lastEra = era;
    }
    const t = TYPES[x.e.type];
    html += `<div class="tl-ev" style="--c:${t.color}"><span class="yr">${esc(fmtYear(x.year))}</span>
      <div class="box"><div class="what">${t.icon} ${esc(x.what)}</div><a href="#/entry/${x.e.id}"><strong>${esc(x.e.title)}</strong></a>${x.e.summary ? ` — <span>${esc(x.e.summary)}</span>` : ''}</div></div>`;
  }
  const present = [...new Set(all.map(x => x.e.type))];
  main.innerHTML = `<div class="page"><h1>Timeline of ${esc(world.name)}</h1>
    <p class="lede">Every dated event, birth, founding and discovery, in order.</p>
    ${present.length ? `<div class="tl-filters">${present.map(k => `<label><input type="checkbox" data-tl="${k}" ${ui.tlHidden.has(k) ? '' : 'checked'}><span class="dot" style="background:${TYPES[k].color}"></span>${esc(TYPES[k].label)}</label>`).join('')}</div>` : ''}
    ${ev.length ? `<div class="timeline">${html}</div>` : `<div class="empty">No dated entries yet. Add a year to an Event, Person, Organization or other entry and it will appear here.${READONLY ? '' : ' Name your eras on the <a href="#/settings">World</a> page.'}</div>`}
  </div>`;
}

// ---------- relationship graph ----------
function renderGraph() {
  main.innerHTML = `<div class="page"><h1>The Web of Relations</h1>
    <div class="toolbar"><label><input type="checkbox" id="g-all" ${ui.graphAll ? 'checked' : ''}> Show unconnected entries</label>
    <button type="button" data-act="g-reset">Re-arrange</button>
    <span class="hint">Drag nodes · drag background to pan · scroll to zoom · click a node to open it</span></div>
    <div class="graph-wrap"><svg id="graph"></svg></div>
    <div class="legend">${Object.values(TYPES).map(t => `<span><span class="dot" style="background:${t.color}"></span>${esc(t.label)}</span>`).join('')}</div>
  </div>`;
  drawGraph();
}
function drawGraph() {
  cancelAnimationFrame(graphRAF);
  const svg = $('#graph');
  const W = svg.clientWidth || 900, H = svg.clientHeight || 620;
  const NS = 'http://www.w3.org/2000/svg';
  const edges = [], seen = new Set(), linked = new Set();
  for (const e of world.entries) for (const r of e.relations) {
    if (!byId(r.to) || r.to === e.id) continue;
    const key = e.id + '>' + r.to;
    if (seen.has(key)) continue;
    seen.add(key); linked.add(e.id); linked.add(r.to);
    edges.push({ s: e.id, t: r.to, label: r.label || '' });
  }
  const list = world.entries.filter(e => ui.graphAll || linked.has(e.id));
  if (!list.length) {
    svg.outerHTML = `<div class="empty">No relationships yet. Edit an entry and add a relationship to start weaving the web.</div>`;
    return;
  }
  const nodes = list.map((e, i) => {
    const a = i / list.length * Math.PI * 2, rad = 120 + Math.random() * 160;
    return { id: e.id, e, x: W / 2 + Math.cos(a) * rad, y: H / 2 + Math.sin(a) * rad, vx: 0, vy: 0, fixed: false };
  });
  const N = Object.fromEntries(nodes.map(n => [n.id, n]));
  const degree = {};
  edges.forEach(ed => { degree[ed.s] = (degree[ed.s] || 0) + 1; degree[ed.t] = (degree[ed.t] || 0) + 1; });

  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let vb = { x: 0, y: 0, w: W, h: H };
  const vp = document.createElementNS(NS, 'g'); svg.appendChild(vp);
  const gEdges = document.createElementNS(NS, 'g'); vp.appendChild(gEdges);
  const gNodes = document.createElementNS(NS, 'g'); vp.appendChild(gNodes);
  edges.forEach(ed => {
    ed.line = document.createElementNS(NS, 'line'); ed.line.setAttribute('class', 'edge'); gEdges.appendChild(ed.line);
    ed.text = document.createElementNS(NS, 'text'); ed.text.setAttribute('class', 'elabel'); ed.text.setAttribute('text-anchor', 'middle'); ed.text.textContent = ed.label; gEdges.appendChild(ed.text);
  });
  nodes.forEach(n => {
    n.r = 9 + Math.min(10, (degree[n.id] || 0) * 1.5);
    n.g = document.createElementNS(NS, 'g'); n.g.setAttribute('class', 'node'); n.g.dataset.id = n.id;
    n.g.innerHTML = `<circle r="${n.r}" fill="${TYPES[n.e.type].color}"></circle><text y="${n.r + 14}" text-anchor="middle">${esc(n.e.title)}</text><title>${esc(TYPES[n.e.type].singular)}: ${esc(n.e.title)}</title>`;
    gNodes.appendChild(n.g);
  });

  let alpha = 1;
  function tick() {
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy || 1;
      if (d2 > 250000) continue;
      const f = 5200 / d2 * alpha, d = Math.sqrt(d2);
      dx /= d; dy /= d;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
    for (const ed of edges) {
      const a = N[ed.s], b = N[ed.t];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = (d - 140) * 0.03 * alpha;
      a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f;
    }
    for (const n of nodes) {
      n.vx += (W / 2 - n.x) * 0.004 * alpha; n.vy += (H / 2 - n.y) * 0.004 * alpha;
      if (!n.fixed) { n.x += n.vx; n.y += n.vy; }
      n.vx *= 0.82; n.vy *= 0.82;
    }
    paint();
    alpha *= 0.985;
    if (alpha > 0.01) graphRAF = requestAnimationFrame(tick);
  }
  function paint() {
    for (const ed of edges) {
      const a = N[ed.s], b = N[ed.t];
      ed.line.setAttribute('x1', a.x); ed.line.setAttribute('y1', a.y); ed.line.setAttribute('x2', b.x); ed.line.setAttribute('y2', b.y);
      ed.text.setAttribute('x', (a.x + b.x) / 2); ed.text.setAttribute('y', (a.y + b.y) / 2 - 3);
    }
    for (const n of nodes) n.g.setAttribute('transform', `translate(${n.x},${n.y})`);
  }
  function reheat() { cancelAnimationFrame(graphRAF); alpha = Math.max(alpha, 0.4); graphRAF = requestAnimationFrame(tick); }
  function toWorld(ev) {
    const r = svg.getBoundingClientRect();
    return { x: vb.x + (ev.clientX - r.left) / r.width * vb.w, y: vb.y + (ev.clientY - r.top) / r.height * vb.h };
  }
  function setVB() { svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }

  let drag = null;
  svg.addEventListener('pointerdown', ev => {
    const g = ev.target.closest('.node');
    const p = toWorld(ev);
    drag = g ? { node: N[g.dataset.id], moved: false, sx: ev.clientX, sy: ev.clientY } : { pan: true, sx: ev.clientX, sy: ev.clientY, vx: vb.x, vy: vb.y };
    if (drag.node) { drag.node.fixed = true; drag.ox = drag.node.x - p.x; drag.oy = drag.node.y - p.y; }
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove', ev => {
    if (!drag) return;
    if (Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) > 4) drag.moved = true;
    if (drag.node) {
      const p = toWorld(ev);
      drag.node.x = p.x + drag.ox; drag.node.y = p.y + drag.oy;
      reheat();
    } else {
      const r = svg.getBoundingClientRect();
      vb.x = drag.vx - (ev.clientX - drag.sx) / r.width * vb.w;
      vb.y = drag.vy - (ev.clientY - drag.sy) / r.height * vb.h;
      setVB();
    }
  });
  svg.addEventListener('pointerup', () => {
    if (drag?.node) {
      if (!drag.moved) go('#/entry/' + drag.node.id);
      drag.node.fixed = false;
    }
    drag = null;
  });
  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const p = toWorld(ev), k = ev.deltaY > 0 ? 1.12 : 1 / 1.12;
    const w = Math.min(W * 6, Math.max(W / 6, vb.w * k)), s = w / vb.w;
    vb = { x: p.x - (p.x - vb.x) * s, y: p.y - (p.y - vb.y) * s, w, h: vb.h * s };
    setVB();
  }, { passive: false });
  tick();
}

// ---------- export / import ----------
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function worldJSON() { return JSON.stringify({ ...world, exported: Date.now() }, null, 2); }
function encyclopediaHTML(includeSecrets) {
  const w = structuredClone(world);
  if (!includeSecrets) w.entries.forEach(e => { e.secret = ''; });
  const data = JSON.stringify(w).replace(/</g, '\\u003c');
  const fonts = $('link[data-fonts]').outerHTML;
  return `<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>${esc(w.name)} — Encyclopedia</title>\n${fonts}\n<style id="style">${$('#style').textContent}</style>\n</head>\n<body class="readonly">\n${SHELL}\n<script>window.__WORLD__ = ${data};<\/script>\n<script id="app-script">${$('#app-script').textContent}<\/script>\n</body>\n</html>\n`;
}
function askSecrets() {
  return world.entries.some(e => e.secret) ? confirm('Include your 🔒 secret notes in the HTML encyclopedia?\n\nOK = include them, Cancel = leave them out (recommended if you will share it).') : false;
}
async function saveToFolder() {
  const base = slug(world.name);
  const secrets = askSecrets();
  if (!window.showDirectoryPicker) {
    alert('Your browser can\'t write to folders directly (Chrome and Edge can). Both files will download instead. Move them into your builder/exports folder.');
    download(base + '.world.json', worldJSON(), 'application/json');
    download(base + '.html', encyclopediaHTML(secrets), 'text/html');
    return;
  }
  try {
    let dir = await store.get('dirHandle');
    if (dir && (await dir.requestPermission({ mode: 'readwrite' })) !== 'granted') dir = null;
    if (!dir || !confirm(`Save into the folder "${dir.name}"?\n\nCancel to choose a different folder.`)) {
      dir = await window.showDirectoryPicker({ id: 'worldbuilder', mode: 'readwrite' });
      try { await store.set('dirHandle', dir); } catch { /* handle not storable in this browser */ }
    }
    for (const [name, text] of [[base + '.world.json', worldJSON()], [base + '.html', encyclopediaHTML(secrets)]]) {
      const fh = await dir.getFileHandle(name, { create: true });
      const wr = await fh.createWritable(); await wr.write(text); await wr.close();
    }
    toast(`Saved ${base}.world.json and ${base}.html to "${dir.name}"`);
  } catch (err) {
    if (err.name !== 'AbortError') alert('Could not save to the folder: ' + err.message);
  }
}
async function importFile(file) {
  try {
    const w = normalize(JSON.parse(await file.text()));
    if (!w) throw new Error('This does not look like a world file.');
    if (world.entries.length && !confirm(`Replace "${world.name}" with "${w.name}" (${w.entries.length} entries)?\n\nExport your current world first if you want to keep it.`)) return;
    world = w; save(); toast(`Imported ${w.name}`); go('#/home');
  } catch (err) { alert('Import failed: ' + err.message); }
}

// ---------- events ----------
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'new') { go('#/new/' + el.dataset.type); }
  else if (act === 'delete') {
    const e = byId(el.dataset.id);
    if (e && confirm(`Delete "${e.title}" forever?`)) {
      world.entries = world.entries.filter(x => x.id !== e.id);
      world.entries.forEach(x => { x.relations = x.relations.filter(r => r.to !== e.id); });
      save(); toast('Entry deleted'); go('#/home');
    }
  }
  else if (act === 'add-row') { $('#rels').insertAdjacentHTML('beforeend', relRow()); }
  else if (act === 'add-era') { $('#eras').insertAdjacentHTML('beforeend', eraRow()); }
  else if (act === 'rm-row') { el.parentElement.remove(); }
  else if (act === 'rm-img') { draft.image = ''; renderImgPreview(); }
  else if (act === 'zoom') { $('#lightbox img').src = el.src; $('#lightbox').classList.add('open'); }
  else if (act === 'g-reset') { drawGraph(); }
  else if (act === 'export-json') { download(slug(world.name) + '.world.json', worldJSON(), 'application/json'); toast('World file downloaded. Move it into builder/exports.'); }
  else if (act === 'export-html') { download(slug(world.name) + '.html', encyclopediaHTML(askSecrets()), 'text/html'); toast('Encyclopedia downloaded. Move it into builder/exports.'); }
  else if (act === 'save-folder') { saveToFolder(); }
  else if (act === 'import') { $('#import-file').click(); }
  else if (act === 'sample') {
    if (!world.entries.length || confirm('Replace your current world with the sample world? Export first if you want to keep it.')) { world = sampleWorld(); save(); go('#/home'); }
  }
  else if (act === 'new-world') {
    if (confirm('Start a new blank world? Your current world will be erased from this browser. Export it first if you want to keep it.')) { world = blankWorld(); save(); go('#/settings'); }
  }
  if (el.closest('details.menu')) el.closest('details.menu').removeAttribute('open');
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'edit-form') submitEdit(ev.target);
  if (ev.target.id === 'settings-form') submitSettings(ev.target);
});
document.addEventListener('change', async ev => {
  const t = ev.target;

    document.body.classList.add('readonly');
    world = normalize(window.__WORLD__) || blankWorld();
  } else {
    world = normalize(await store.get('world')) || blankWorld();
  }
  route();
})();
</script>
