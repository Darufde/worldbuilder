<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worldbuilder Encyclopedia</title>
<link data-fonts rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<script id="theme-boot">
try { const t = localStorage.getItem('wb:theme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { document.documentElement.dataset.theme = 'light'; }
</script>
<style id="style">
:root {
  --parch: #f3e8cf;
  --parch-2: #eadbb8;
  --parch-3: #dcc79a;
  --ink: #3a2a1a;
  --ink-soft: #6b5640;
  --blood: #7a1f1f;
  --gold: #a67c2e;
  --line: #c9b184;
  --card: #f8f0dc;
  --shadow: 0 2px 10px rgba(60, 40, 15, .18);
  --bg: #e4d3ab;
  --bg-glow: rgba(255,250,235,.7);
  --bg-shade: rgba(120,80,30,.25);
  --side: rgba(234, 219, 184, .75);
  --input: #fffaf0;
  --on-color: #fbefd9;
  --primary: #7a1f1f;
  --primary-hover: #8f2727;
  --bar: #3a2a1a;
  --bar-ink: #f3e8cf;
  --bar-soft: #cdb88d;
  --bar-line: #6b5640;
  --bar-hover: #5a4228;
  --graph-bg: #fbf4e2;
  --edge: #9c8559;
  --missing: #b0503a;
  color-scheme: light;
  --head: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --body: 'EB Garamond', Garamond, Georgia, serif;
}
/* Dark: a candlelit, leather-bound tome */
:root[data-theme="dark"] {
  --parch: #2b2119;
  --parch-2: #362a1f;
  --parch-3: #47372a;
  --ink: #ecdfc4;
  --ink-soft: #b4a07e;
  --blood: #e0806f;
  --gold: #c9a050;
  --line: #5a4632;
  --card: #231a13;
  --shadow: 0 4px 18px rgba(0, 0, 0, .55);
  --bg: #15100b;
  --bg-glow: rgba(201,160,80,.10);
  --bg-shade: rgba(0,0,0,.5);
  --side: rgba(30, 23, 16, .92);
  --input: #1a140e;
  --primary: #8f2a24;
  --primary-hover: #a5352d;
  --bar: #0e0a07;
  --bar-line: #4a3a29;
  --bar-hover: #2e2318;
  --graph-bg: #1c1510;
  --edge: #7d6844;
  --missing: #e09a5a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--body);
  font-size: 18px;
  color: var(--ink);
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at top left, var(--bg-glow), transparent 60%),
    radial-gradient(ellipse at bottom right, var(--bg-shade), transparent 70%);
  background-attachment: fixed;
  min-height: 100vh;
}
a { color: var(--blood); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { font-family: var(--head); font-weight: 700; color: var(--ink); letter-spacing: .03em; }
button, .btn, select, input, textarea { font-family: var(--body); font-size: 17px; }
button, .btn {
  background: var(--parch-2); color: var(--ink); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 12px; cursor: pointer; display: inline-block; line-height: 1.2;
}
button:hover, .btn:hover { background: var(--parch-3); text-decoration: none; }
button.primary, .btn.primary { background: var(--primary); color: var(--on-color); border-color: #5a1515; }
button.primary:hover { background: var(--primary-hover); }
button.danger { color: var(--blood); border-color: var(--blood); background: transparent; }
input, select, textarea {
  width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--input); color: var(--ink);
}
textarea { resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 0; }

/* Layout */
#app { display: grid; grid-template-columns: 290px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }
header.top {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--bar); color: var(--bar-ink);
  border-bottom: 4px double var(--gold);
}
header.top .brand { font-family: var(--head); font-size: 22px; color: var(--bar-ink); flex: 1; min-width: 180px; }
header.top .brand small { display: block; font-family: var(--body); font-style: italic; font-size: 14px; color: var(--bar-soft); letter-spacing: 0; }
header.top nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
header.top nav a, header.top nav summary, header.top nav button {
  color: var(--bar-ink); background: transparent; border: 1px solid var(--bar-line); padding: 5px 11px; border-radius: 4px;
  font-family: var(--head); font-size: 14px; cursor: pointer; list-style: none;
}
header.top nav a:hover, header.top nav summary:hover, header.top nav button:hover { background: var(--bar-hover); text-decoration: none; }
header.top nav a.active { background: var(--gold); color: #2b1d0e; border-color: var(--gold); }
details.menu { position: relative; }
details.menu summary::-webkit-details-marker { display: none; }
details.menu .menu-pop {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 50; min-width: 250px;
  background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 6px;
}
details.menu .menu-pop button { display: block; width: 100%; text-align: left; margin: 2px 0; color: var(--ink); font-family: var(--body); font-size: 16px; border: none; background: transparent; }
details.menu .menu-pop button:hover { background: var(--parch-2); }
.save-state { font-size: 13px; color: var(--bar-soft); font-style: italic; min-width: 60px; }
#menu-toggle { display: none; }

aside.side {
  background: var(--side); border-right: 1px solid var(--line);
  padding: 14px; overflow-y: auto; max-height: calc(100vh - 60px); position: sticky; top: 0;
}
aside.side .search { margin-bottom: 10px; }
aside.side h4 { font-size: 13px; margin: 16px 0 6px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .12em; }
.type-list a { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-radius: 4px; color: var(--ink); }
.type-list a:hover, .type-list a.active { background: var(--parch-3); text-decoration: none; }
.type-list .count { font-size: 14px; color: var(--ink-soft); }
.entry-list a { display: block; padding: 3px 8px 3px 14px; color: var(--ink); border-left: 3px solid transparent; font-size: 16px; }
.entry-list a:hover { background: var(--parch-3); text-decoration: none; }
.entry-list a.active { border-left-color: var(--blood); background: var(--parch-3); }
.entry-list .group { font-family: var(--head); font-size: 13px; margin: 10px 0 2px; color: var(--ink-soft); }
.tag-cloud { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  display: inline-block; font-size: 14px; padding: 1px 9px; border-radius: 12px;
  background: var(--parch); border: 1px solid var(--line); color: var(--ink-soft);
}
a.tag:hover, a.tag.active { background: var(--primary); color: var(--on-color); border-color: var(--primary); text-decoration: none; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

main#main { padding: 26px 34px 80px; min-width: 0; }
.page {
  max-width: 1050px; margin: 0 auto; background: var(--card);
  border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 3px; padding: 30px 38px;
  position: relative;
}
.page::before {
  content: ""; position: absolute; inset: 6px; border: 1px solid rgba(166,124,46,.35); pointer-events: none; border-radius: 2px;
}
.page h1 { font-size: 36px; margin: 0 0 4px; }
.page h2 { font-size: 26px; margin: 0 0 14px; }
.page .lede { font-style: italic; color: var(--ink-soft); font-size: 20px; margin: 0 0 18px; }
.divider { text-align: center; color: var(--gold); margin: 22px 0; letter-spacing: .5em; }
.hint { color: var(--ink-soft); font-style: italic; font-size: 15px; }
.empty { text-align: center; padding: 30px; color: var(--ink-soft); font-style: italic; }

/* Home */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin: 16px 0; }
.stat {
  display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--parch);
  color: var(--ink); border-top: 4px solid var(--c, var(--gold));
}
.stat:hover { background: var(--parch-2); text-decoration: none; }
.stat .n { font-family: var(--head); font-size: 26px; display: block; }
.stat .l { font-size: 15px; color: var(--ink-soft); }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card {
  display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 4px; background: var(--parch);
  color: var(--ink); overflow: hidden; border-top: 4px solid var(--c, var(--gold));
}
.card:hover { box-shadow: var(--shadow); text-decoration: none; transform: translateY(-1px); }
.card img { width: 100%; height: 140px; object-fit: cover; border-bottom: 1px solid var(--line); }
.card .body { padding: 10px 12px; }
.card .t { font-family: var(--head); font-size: 17px; display: block; }
.card .s { font-size: 15px; color: var(--ink-soft); }

/* Entry */
.entry-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.badge {
  display: inline-block; font-family: var(--head); font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 9px; border-radius: 3px; color: var(--on-color); background: var(--c, var(--gold));
}
.entry-grid { display: grid; grid-template-columns: 1fr 290px; gap: 28px; margin-top: 14px; }
.infobox { border: 1px solid var(--line); background: var(--parch); border-radius: 3px; align-self: start; font-size: 16px; }
.infobox .ib-title { font-family: var(--head); text-align: center; padding: 8px; background: var(--c, var(--gold)); color: var(--on-color); }
.infobox img { width: 100%; display: block; border-bottom: 1px solid var(--line); cursor: zoom-in; }
.infobox table { width: 100%; border-collapse: collapse; }
.infobox th, .infobox td { padding: 6px 10px; border-top: 1px solid var(--line); vertical-align: top; text-align: left; }
.infobox th { width: 42%; font-weight: 600; color: var(--ink-soft); }
.article { line-height: 1.6; }
.article p:first-child::first-letter {
  font-family: var(--head); float: left; font-size: 3.2em; line-height: .9; padding: 4px 8px 0 0; color: var(--blood);
}
.article blockquote { border-left: 3px solid var(--gold); margin: 12px 0; padding: 4px 16px; font-style: italic; color: var(--ink-soft); }
.article h3, .article h4 { margin: 22px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.rels { display: grid; gap: 4px; }
.rels li { list-style: none; }
.rels ul { padding: 0; margin: 0; }
.rel-label { color: var(--ink-soft); font-style: italic; }
.secret { border: 1px dashed var(--blood); background: rgba(122,31,31,.06); padding: 10px 14px; border-radius: 4px; margin-top: 18px; }
.secret h4 { margin: 0 0 6px; color: var(--blood); font-size: 14px; }
.entry-actions { display: flex; gap: 8px; }

/* Forms */
form.edit label { display: block; margin: 12px 0; font-weight: 600; }
form.edit label > input, form.edit label > select, form.edit label > textarea { margin-top: 4px; font-weight: 400; }
form.edit fieldset { border: 1px solid var(--line); border-radius: 4px; padding: 6px 16px 12px; margin: 18px 0; }
form.edit legend { font-family: var(--head); padding: 0 8px; color: var(--ink-soft); }
.field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 16px; }
.row { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; margin: 6px 0; align-items: center; }
.era-row { display: grid; grid-template-columns: 1.6fr 1fr 1fr 60px auto; gap: 8px; margin: 6px 0; align-items: center; }
.era-row input[type=color] { padding: 2px; height: 36px; }
.img-edit { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.img-edit img { max-width: 160px; max-height: 120px; border: 1px solid var(--line); border-radius: 3px; }
.form-actions { display: flex; gap: 10px; margin-top: 20px; position: sticky; bottom: 0; background: var(--card); padding: 10px 0; border-top: 1px solid var(--line); }

/* Timeline */
.tl-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.tl-filters label { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--parch); cursor: pointer; }
.tl-filters input { width: auto; }
.timeline { position: relative; padding-left: 110px; }
.timeline::before { content: ""; position: absolute; left: 92px; top: 0; bottom: 0; width: 3px; background: var(--line); }
.tl-era {
  margin: 22px 0 12px -110px; padding: 8px 14px; font-family: var(--head); font-size: 18px; color: var(--on-color);
  background: var(--c, var(--ink-soft)); border-radius: 3px; position: relative; z-index: 1;
}
.tl-era small { font-family: var(--body); font-style: italic; opacity: .85; margin-left: 8px; font-size: 15px; }
.tl-ev { position: relative; margin: 10px 0; }
.tl-ev .yr { position: absolute; left: -110px; width: 80px; text-align: right; font-family: var(--head); font-size: 14px; top: 9px; color: var(--ink-soft); }
.tl-ev::before {
  content: ""; position: absolute; left: -24px; top: 12px; width: 13px; height: 13px; border-radius: 50%;
  background: var(--c, var(--gold)); border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line);
}
.tl-ev .box { background: var(--parch); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--gold)); border-radius: 3px; padding: 7px 12px; }
.tl-ev .box .what { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }

/* Graph */
.graph-wrap { border: 1px solid var(--line); border-radius: 4px; background: var(--graph-bg); overflow: hidden; }
svg#graph { width: 100%; height: 620px; display: block; cursor: grab; touch-action: none; }
svg#graph .edge { stroke: var(--edge); stroke-width: 1.4; }
svg#graph .edge.mention { stroke-dasharray: 4 4; opacity: .75; }
svg#graph .elabel { font-size: 11px; fill: var(--ink-soft); font-style: italic; pointer-events: none; }
svg#graph .node circle { stroke: var(--graph-bg); stroke-width: 2.5; cursor: pointer; }
svg#graph .node text { font-family: var(--head); font-size: 12px; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--graph-bg); stroke-width: 3px; }
svg#graph .node:hover circle { stroke: var(--blood); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 15px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; }
.toolbar input[type=checkbox] { width: auto; }

/* Lightbox */
#lightbox { position: fixed; inset: 0; background: rgba(20,12,4,.85); display: none; align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
#lightbox.open { display: flex; }
#lightbox img { max-width: 94vw; max-height: 94vh; border: 6px solid var(--parch); }

a.wikilink { border-bottom: 1px dotted currentColor; }
a.wikilink:hover { text-decoration: none; border-bottom-style: solid; }
.wikilink.missing { color: var(--missing); border-bottom: 1px dashed currentColor; }
span.wikilink.missing { cursor: default; }
.link-pop {
  position: absolute; z-index: 60; min-width: 240px; max-width: 360px; max-height: 260px; overflow-y: auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 4px; font-weight: 400;
}
.link-pop div { padding: 4px 10px; border-radius: 3px; cursor: pointer; }
.link-pop div.on, .link-pop div:hover { background: var(--parch-3); }
.link-pop .new { font-style: italic; color: var(--ink-soft); }
#theme-toggle { min-width: 38px; }
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--parch);
  padding: 10px 18px; border-radius: 4px; box-shadow: var(--shadow); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 120;
}
#toast.show { opacity: 1; }

#toast.show { pointer-events: auto; }
#toast button { margin-left: 12px; padding: 2px 10px; font-size: 15px; }
.menu-pop a { display: block; padding: 6px 12px; border-radius: 4px; color: var(--ink); font-size: 16px; }
.menu-pop a:hover { background: var(--parch-2); text-decoration: none; }
details.menu .menu-pop a { font-family: var(--body); font-size: 16px; border: none; }
details.menu .menu-pop a:hover { background: var(--parch-2); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.small { font-size: 15px; }
.muted { color: var(--ink-soft); }

/* Hover preview */
.preview {
  position: absolute; z-index: 90; width: 300px; background: var(--card); border: 1px solid var(--line);
  border-top: 4px solid var(--c, var(--gold)); border-radius: 4px; box-shadow: var(--shadow); overflow: hidden; pointer-events: none;
}
.preview img { width: 100%; max-height: 150px; object-fit: cover; display: block; border-bottom: 1px solid var(--line); }
.preview .pv-body { padding: 8px 12px 10px; font-size: 16px; }
.preview strong { display: block; font-family: var(--head); font-size: 17px; margin-top: 4px; }
.preview p { margin: 4px 0 0; color: var(--ink-soft); line-height: 1.35; }

/* On this day */
.otd { border: 1px solid var(--line); border-left: 4px solid var(--gold); background: var(--parch); border-radius: 3px; padding: 12px 16px; margin: 18px 0; }
.otd h3 { margin: 0 0 6px; font-size: 18px; }
.otd ul { margin: 6px 0 0; padding-left: 20px; }

/* Entry extras */
.pin-btn { font-size: 18px; padding: 4px 10px; }
.pin-btn.on { color: var(--gold); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

/* Stubs, history, trash, library */
.stub-sec { margin: 18px 0; }
.stub-sec h3 { margin-bottom: 6px; }
.stub-list { list-style: none; padding: 0; margin: 0; }
.stub-list li { padding: 6px 0; border-bottom: 1px dotted var(--line); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.stub-list li .grow { flex: 1; min-width: 180px; }
.version { border: 1px solid var(--line); border-radius: 4px; background: var(--parch); padding: 10px 14px; margin: 10px 0; }
.version summary { cursor: pointer; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.version .when { font-family: var(--head); font-size: 15px; }
.version .what { color: var(--ink-soft); font-style: italic; font-size: 15px; flex: 1; }
.lib-card { border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 4px; background: var(--parch); padding: 14px; }
.lib-card.current { border-top-color: var(--primary); box-shadow: var(--shadow); }
.lib-card h3 { margin: 0 0 2px; }
.lib-card .btn-row { margin: 10px 0 0; }

/* Settings blocks */
.ctype { border: 1px dashed var(--line); border-radius: 4px; padding: 4px 12px 10px; margin: 10px 0; }
.ctype-grid { display: grid; grid-template-columns: 80px 1fr 1fr 70px; gap: 0 12px; }
.ctype-grid input[type=color] { padding: 2px; height: 38px; }
.date-in { display: grid; grid-template-columns: 1fr 1.3fr .8fr; gap: 6px; margin-top: 4px; font-weight: 400; }
details.extra summary { cursor: pointer; font-family: var(--head); color: var(--ink-soft); margin: 8px 0; }
code { background: var(--parch-2); padding: 0 4px; border-radius: 3px; font-size: .9em; }

/* Calendar */
.cal-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.cal-bar input { width: 120px; }
.cal-months { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.cal-month { border: 1px solid var(--line); background: var(--parch); border-radius: 4px; padding: 10px; }
.cal-month h3 { margin: 0 0 8px; font-size: 17px; text-align: center; }
.cal-grid { display: grid; gap: 3px; }
.cal-wd { font-size: 11px; text-align: center; color: var(--ink-soft); font-family: var(--head); overflow: hidden; white-space: nowrap; }
.cal-day { min-height: 38px; border: 1px solid var(--line); border-radius: 3px; padding: 1px 3px; font-size: 12px; background: var(--card); position: relative; }
.cal-day .n { color: var(--ink-soft); }
.cal-day.hol { background: color-mix(in srgb, var(--gold) 28%, var(--card)); border-color: var(--gold); }
.cal-day.today { outline: 2px solid var(--primary); }
.cal-day.blank { border: none; background: transparent; }
.cal-ev { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin: 1px; vertical-align: middle; }
.cal-list li { margin: 3px 0; }

/* Family tree */
.tree-wrap { border: 1px solid var(--line); border-radius: 4px; background: var(--graph-bg); overflow: hidden; }
svg#tree { width: 100%; height: 640px; display: block; cursor: grab; touch-action: none; }
svg#tree .fnode rect { fill: var(--parch); stroke: var(--c); stroke-width: 2; }
svg#tree .fnode.root rect { stroke-width: 4; fill: var(--parch-2); }
svg#tree .fnode { cursor: pointer; }
svg#tree .fnode:hover rect { fill: var(--parch-3); }
svg#tree .fnode .nm { font-family: var(--head); font-size: 13px; fill: var(--ink); }
svg#tree .fnode .yrs { font-size: 12px; fill: var(--ink-soft); font-style: italic; }
svg#tree .f-line { stroke: var(--edge); stroke-width: 1.8; fill: none; }
svg#tree .f-spouse { stroke: var(--gold); stroke-width: 2; }
svg#tree .f-sib { stroke: var(--edge); stroke-dasharray: 4 4; fill: none; }

.map-view { position: relative; height: 70vh; min-height: 380px; overflow: hidden; border: 1px solid var(--line); border-radius: 4px; background: var(--graph-bg); cursor: grab; touch-action: none; user-select: none; }
.map-view.adding { cursor: crosshair; }
.map-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; --z: 1; }
.map-inner img { display: block; max-width: none; pointer-events: none; }
.pin {
  position: absolute; transform: translate(-50%, -100%) scale(calc(1 / var(--z))); transform-origin: 50% 100%;
  display: flex; flex-direction: column; align-items: center; background: none; border: none; padding: 0; cursor: pointer; z-index: 2;
}
.pin:hover { background: none; }
.pin .pin-head {
  width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--c); border: 2px solid #fbefd9;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.4); order: 2;
}
.pin .pin-head span { transform: rotate(45deg); font-size: 14px; }
.pin .pin-label {
  order: 1; font-family: var(--head); font-size: 12px; color: #2b1d0e; background: rgba(251,239,217,.92); border: 1px solid #c9b184;
  padding: 0 6px; border-radius: 3px; margin-bottom: 3px; white-space: nowrap;
}
.pin-pop {
  position: absolute; z-index: 5; width: 270px; background: var(--card); border: 1px solid var(--line); border-radius: 4px;

}
.pin-pop label { display: block; margin: 6px 0; font-size: 15px; }
.pin-pop .btn-row { margin: 8px 0 0; }

.pol-wrap { overflow-x: auto; }
table.pol { border-collapse: collapse; margin: 6px 0 14px; }
table.pol th, table.pol td { border: 1px solid var(--line); }
table.pol th.vert { vertical-align: bottom; padding: 6px 2px; height: 150px; }
table.pol th.vert a { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; max-height: 145px; overflow: hidden; text-overflow: ellipsis; display: inline-block; font-size: 15px; }
table.pol th.rowh { text-align: right; padding: 4px 10px; white-space: nowrap; font-weight: 600; font-size: 15px; }
table.pol td { width: 42px; height: 38px; text-align: center; font-size: 18px; background: color-mix(in srgb, var(--c, transparent) 30%, var(--card)); }
table.pol td.cell { cursor: pointer; }
body.readonly table.pol td.cell { cursor: default; }
table.pol td.cell:hover { outline: 2px solid var(--gold); }
table.pol td.self { background: repeating-linear-gradient(45deg, var(--parch-2), var(--parch-2) 4px, var(--card) 4px, var(--card) 8px); }
.pol-menu { position: absolute; z-index: 80; background: var(--card); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 4px; min-width: 200px; }
.pol-menu .hd { font-size: 14px; color: var(--ink-soft); padding: 4px 8px; font-style: italic; }
.pol-menu button { display: block; width: 100%; text-align: left; border: none; background: transparent; }
.pol-menu button:hover { background: var(--parch-2); }

#app.book-mode { grid-template-columns: 1fr; }
#app.book-mode aside.side { display: none; }
.book-bar { max-width: 900px; margin: 0 auto 14px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.book-bar label { display: inline-flex; gap: 6px; align-items: center; }
.book-bar input { width: auto; }
.book { max-width: 900px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 40px 56px; }
.book-cover { text-align: center; padding: 120px 0 140px; border-bottom: 1px solid var(--line); }
.book-cover h1 { font-size: 54px; margin: 10px 0; }
.book-cover .orn { color: var(--gold); font-size: 40px; letter-spacing: .4em; }
.book-sec { padding: 30px 0; border-bottom: 1px solid var(--line); }
.book-toc ol { columns: 2; column-gap: 40px; margin: 4px 0 14px; }
.book-toc h3 { margin: 14px 0 4px; font-size: 17px; }
.vol-title { text-align: center; font-size: 34px; margin: 40px 0 20px; padding-bottom: 10px; border-bottom: 3px double var(--gold); }
.book-entry { padding: 18px 0; border-bottom: 1px dotted var(--line); overflow: hidden; }
.book-entry h3 { font-size: 24px; margin: 0 0 4px; break-after: avoid; }
.book-entry .infobox { float: right; width: 250px; margin: 0 0 12px 20px; break-inside: avoid; }
.book-entry .conn { font-size: 15px; color: var(--ink-soft); margin-top: 8px; clear: both; }
table.chron { width: 100%; border-collapse: collapse; font-size: 16px; }

table.chron td:first-child { white-space: nowrap; font-family: var(--head); font-size: 14px; color: var(--ink-soft); width: 1%; }

body.readonly [data-edit] { display: none !important; }

@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; }
  aside.side { display: none; position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--line); }
  #app.side-open aside.side { display: block; }
  #menu-toggle { display: inline-block; }
  main#main { padding: 14px 12px 60px; }
  .page { padding: 20px 18px; }

  .timeline::before { left: 60px; }

  .tl-ev .yr { left: -78px; width: 52px; font-size: 12px; }
  .row, .era-row, .ctype-grid { grid-template-columns: 1fr; }
  .book { padding: 20px 18px; }
  .book-entry .infobox { float: none; width: auto; margin: 0 0 12px; }
  .book-toc ol { columns: 1; }
  .map-view { height: 80vw; min-height: 280px; }
  svg#tree, svg#graph { height: 480px; }
}
@media print {

  #app { display: block; }
  main#main { padding: 0; }
  .page, .book { box-shadow: none; border: none; padding: 0; max-width: none; }

  .book-cover { height: 90vh; display: flex; flex-direction: column; justify-content: center; border: none; break-after: page; }

  .book-entry .infobox { float: right; width: 36%; margin: 0 0 10px 18px; }

}

  for (const line of esc(src).split(/\r?\n/)) {
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flush(); out.push(m[1].length === 1 ? `<h3>${inline(m[2])}</h3>` : `<h4>${inline(m[2])}</h4>`); }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (para.length || quote.length) { const l = list; list = []; flush(); list = l; } list.push(m[1]); }
    else if ((m = line.match(/^&gt;\s?(.*)/))) { if (para.length || list.length) flush(); quote.push(m[1]); }
    else if (!line.trim()) flush();
    else { if (list.length || quote.length) flush(); para.push(line); }
  }
  flush();
  return out.join('');
}

// ---------- world model ----------
function blankWorld() {
  return {
    format: 'worldbuilder', version: 2, id: uid(), name: 'Untitled World', tagline: 'An encyclopedia yet unwritten',
    overview: '', calendar: { suffix: 'AE', before: 'BE', months: [], weekdays: [], holidays: [] }, eras: [],
    customTypes: [], extraFields: {}, entries: [], trash: [], created: Date.now(), updated: Date.now(),
  };
}
function typesFor(w) {
  const t = {};
  for (const [k, b] of Object.entries(BASE_TYPES)) t[k] = { ...b, fields: [...b.fields, ...arr((w.extraFields || {})[k])] };
  for (const c of arr(w.customTypes)) {
    if (c.key && !t[c.key]) t[c.key] = { label: c.label || c.singular, singular: c.singular || 'Custom', icon: c.icon || '◆', color: c.color || '#6b5640', fields: arr(c.fields), custom: true };
  }
  return t;
}
function normEntry(e, types = TYPES) {
  return {
    title: 'Untitled', summary: '', body: '', image: '', secret: '', pinned: false, ...e,
    type: types[e.type] ? e.type : 'lore', fields: e.fields || {},
    tags: arr(e.tags), relations: arr(e.relations), pins: arr(e.pins), history: arr(e.history),
  };
}
function normalize(w) {
  if (!w || typeof w !== 'object' || !Array.isArray(w.entries)) return null;
  const base = blankWorld();
  w = { ...base, ...w, calendar: { ...base.calendar, ...(w.calendar || {}) } };
  for (const k of ['eras', 'customTypes', 'trash']) w[k] = arr(w[k]);
  for (const k of ['months', 'weekdays', 'holidays']) w.calendar[k] = arr(w.calendar[k]);
  if (!w.extraFields || typeof w.extraFields !== 'object') w.extraFields = {};
  // Version 1 stored dates in fields typed "number"; field keys are unchanged so no migration is needed.
  const types = typesFor(w);
  w.entries = w.entries.filter(e => e && e.id).map(e => normEntry(e, types));
  return w;
}
function setWorld(w) { world = w; TYPES = typesFor(w); }

// Field definitions written one per line: "Name", "Name: number", "Name: year", "Name: a, b, c".
function parseFields(text, prev = []) {
  const used = new Set();
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const i = line.indexOf(':');
    const name = (i < 0 ? line : line.slice(0, i)).trim();
    const spec = i < 0 ? '' : line.slice(i + 1).trim();
    if (!name) return null;
    let k = prev.find(f => norm(f.l) === norm(name))?.k || 'c_' + slug(name).replace(/-/g, '_');
    while (used.has(k)) k += '_';
    used.add(k);
    if (/^(year|date)$/i.test(spec)) return { k, l: name, t: 'year', tl: name };
    if (/^number$/i.test(spec)) return { k, l: name, t: 'number' };
    const opts = spec.split(',').map(s => s.trim()).filter(Boolean);
    if (opts.length > 1) return { k, l: name, t: 'select', o: opts };
    return { k, l: name, t: 'text' };
  }).filter(Boolean);
}
const fieldsText = fields => arr(fields).map(f => f.t === 'year' ? `${f.l}: year` : f.t === 'number' ? `${f.l}: number` : f.t === 'select' ? `${f.l}: ${f.o.join(', ')}` : f.l).join('\n');

// ---------- storage (IndexedDB with localStorage fallback) ----------
const store = {
  _db: null,
  open() {
    if (this._db) return this._db;
    this._db = new Promise((res, rej) => {
      const r = indexedDB.open('worldbuilder', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async req(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('kv', mode), r = fn(tx.objectStore('kv'));
      tx.oncomplete = () => res(r.result); tx.onerror = () => rej(tx.error);
    });
  },
  async get(k) {
    try { return await this.req('readonly', s => s.get(k)); }
    catch { try { return JSON.parse(localStorage.getItem('wb:' + k)); } catch { return null; } }
  },
  async set(k, v) {
    try { await this.req('readwrite', s => s.put(v, k)); }
    catch { localStorage.setItem('wb:' + k, JSON.stringify(v)); }
  },
  async del(k) {
    try { await this.req('readwrite', s => s.delete(k)); } catch { try { localStorage.removeItem('wb:' + k); } catch { /* nothing stored */ } }
  },
};
const meta = w => ({ id: w.id, name: w.name, tagline: w.tagline, updated: w.updated, count: w.entries.length });
async function loadLibrary() {
  lib = arr(await store.get('lib'));
  if (!lib.length) {
    // Migrate the single world saved by version 1.
    const old = normalize(await store.get('world'));
    if (old) { await store.set('world:' + old.id, old); lib = [meta(old)]; await store.set('lib', lib); await store.set('current', old.id); await store.del('world'); }
  }
}
async function openWorld(id) {
  const w = normalize(await store.get('world:' + id));
  if (!w) return false;
  setWorld(w);
  await store.set('current', id);
  return true;
}
async function addWorld(w, open = true) {
  w.updated = Date.now();
  await store.set('world:' + w.id, w);
  lib = lib.filter(m => m.id !== w.id); lib.push(meta(w));
  await store.set('lib', lib);
  if (open) { setWorld(w); await store.set('current', w.id); }
}
async function removeWorld(id) {
  await store.del('world:' + id);
  lib = lib.filter(m => m.id !== id);
  await store.set('lib', lib);
}
let saveTimer = null;
function save() {
  if (READONLY) return;
  world.updated = Date.now();
  $('#save-state').textContent = 'saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeNow, 300);
}
async function writeNow() {
  clearTimeout(saveTimer); saveTimer = null;
  try {
    await store.set('world:' + world.id, world);
    const i = lib.findIndex(m => m.id === world.id);
    if (i >= 0) lib[i] = meta(world); else lib.push(meta(world));

}

// "Today" in the world: today's real fraction of the year mapped onto the custom calendar.
function todayInWorld() {
  const ms = months(), total = yearDays();
  if (!ms.length || !total) return null;
  const now = new Date(), start = new Date(now.getFullYear(), 0, 1), next = new Date(now.getFullYear() + 1, 0, 1);
  let doy = Math.floor((now - start) / (next - start) * total);
  for (let i = 0; i < ms.length; i++) {
    const n = Number(ms[i].days) || 0;
    if (doy < n) return { m: i + 1, d: doy + 1 };
    doy -= n;
  }
  return { m: ms.length, d: Number(ms[ms.length - 1].days) || 1 };
}
function onThisDayHTML() {
  const ev = timelineEvents();
  const t = todayInWorld();
  const item = x => `<li><strong>${esc(fmtDate(x.year, x.m, x.d))}</strong> · ${TYPES[x.e.type].icon} <a href="#/entry/${x.e.id}">${esc(x.e.title)}</a> <span class="muted">${esc(x.what.toLowerCase())}</span></li>`;
  let html = '';
  if (t) {
    const hits = ev.filter(x => x.m === t.m && x.d === t.d);
    const hol = world.calendar.holidays.filter(h => h.month === t.m && h.day === t.d);
    html += `<h3>☀ On this day</h3><p style="margin:0">In ${esc(world.name)} it is the <strong>${ordinal(t.d)} of ${esc(months()[t.m - 1].name)}</strong>.</p>`;
    if (hol.length) html += `<p style="margin:6px 0 0">🎉 ${hol.map(h => `<strong>${esc(h.name)}</strong>${h.note ? ` — <em>${esc(h.note)}</em>` : ''}`).join(' · ')}</p>`;
    if (hits.length) return `<div class="otd">${html}<ul>${hits.map(item).join('')}</ul></div>`;
  }
  if (!ev.length) return html ? `<div class="otd">${html}</div>` : '';
  // No anniversary today: feature one dated event, chosen by today's date so it changes daily.
  const d = new Date(), seed = d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate();
  const x = ev[seed % ev.length];
  return `<div class="otd">${html}<h3 style="margin-top:${html ? '10px' : '0'}">📜 From the chronicles</h3><ul>${item(x)}</ul>${x.e.summary ? `<p class="hint" style="margin:4px 0 0">${esc(x.e.summary)}</p>` : ''}</div>`;
}

function readImage(file, max) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Unreadable image'));
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.86));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    <p class="hint">Click anyone to center the tree on them · drag to pan · scroll to zoom · <a href="#/entry/${root.id}">open ${esc(root.title)}'s entry</a></p>

// ---------- stubs ----------
function stubData() {
  const missing = new Map();
  const scan = (text, src) => {
    for (const m of (text || '').matchAll(LINK_RE)) {
      const t = m[1].trim();
      if (findByTitle(t)) continue;
      if (!missing.has(norm(t))) missing.set(norm(t), { title: t, from: new Map() });
      if (src) missing.get(norm(t)).from.set(src.id, src);
    }
  };
  world.entries.forEach(e => { scan(e.body, e); scan(e.secret, e); });
  scan(world.overview, null);
  const linked = new Set();
  world.entries.forEach(e => {
    e.relations.forEach(r => { linked.add(e.id); linked.add(r.to); });
    linkTargets(e.body).forEach(id => { linked.add(id); linked.add(e.id); });
  });
  const es = [...world.entries].sort(byTitle);
  return {
    missing: [...missing.values()].sort((a, b) => b.from.size - a.from.size || a.title.localeCompare(b.title)),
    noBody: es.filter(e => !e.body.trim()),
    noSummary: es.filter(e => !e.summary.trim()),
    orphans: es.filter(e => !linked.has(e.id)),
    noImage: es.filter(e => !e.image && ['person', 'place', 'species', 'item'].includes(e.type)),
  };
}

const SNAP_NAMES = { type: 'category', title: 'title', summary: 'summary', body: 'article', secret: 'secret notes', fields: 'details', tags: 'tags', relations: 'relationships' };
function renderHistory(e) {
  const versions = e.history;
  const changes = (v, newer) => SNAP_KEYS.filter(k => JSON.stringify(v[k]) !== JSON.stringify(newer[k])).map(k => SNAP_NAMES[k]).concat('image' in v ? ['image'] : []);
  main.innerHTML = `<div class="page"><h1>🕓 History of ${esc(e.title)}</h1>
    <p class="lede">Earlier versions are kept each time you save (up to 25). Restoring keeps the current version in this list too.</p>
    <p><a href="#/entry/${e.id}">← Back to the entry</a></p>
    ${versions.length ? versions.map((v, i) => `<details class="version"><summary><span class="when">${esc(new Date(v.at).toLocaleString())}</span>
        <span class="what">${esc(v.title)} · changed afterwards: ${esc(changes(v, i ? versions[i - 1] : e).join(', ') || 'nothing')}</span>
        <button type="button" data-act="restore-version" data-id="${e.id}" data-i="${i}">↺ Restore</button></summary>
        ${v.summary ? `<p class="lede" style="font-size:17px">${esc(v.summary)}</p>` : ''}<div class="article">${md(v.body) || '<p class="hint">(no article)</p>'}</div>
        ${v.tags.length ? `<p class="small muted">Tags: ${esc(v.tags.join(', '))}</p>` : ''}</details>`).join('')
      : '<div class="empty">No earlier versions yet.</div>'}
  </div>`;
}
function restoreVersion(e, i) {
  const v = e.history[i];
  if (!v) return;
  const nextImage = 'image' in v ? v.image : e.image;
  e.history = [snapshot(e, nextImage), ...e.history.filter((_, j) => j !== i)].slice(0, 25);
  SNAP_KEYS.forEach(k => e[k] = structuredClone(v[k]));
  e.image = nextImage;
  if (!TYPES[e.type]) e.type = 'lore';
  e.updated = Date.now();
  save(); toast('Version restored'); go('#/entry/' + e.id);
}
function trashEntry(e) {
  const removed = [];
  world.entries.forEach(x => { x.relations = x.relations.filter(r => { if (r.to === e.id) { removed.push({ from: x.id, rel: r }); return false; } return true; }); });
  world.entries = world.entries.filter(x => x.id !== e.id);
  world.trash = [{ entry: e, removed, at: Date.now() }, ...world.trash].slice(0, 30);
  save();
}
function restoreTrash(i) {
  const [t] = world.trash.splice(i, 1);
  if (!t) return null;
  world.entries.push(normEntry(t.entry));
  t.removed.forEach(({ from, rel }) => { const x = byId(from); if (x && !x.relations.some(r => r.to === rel.to && r.label === rel.label)) x.relations.push(rel); });
  save();
  return t.entry;
}
function renderTrash() {
  main.innerHTML = `<div class="page"><h1>🗑 Recently Deleted</h1><p class="lede">The last 30 deleted entries can be brought back, along with their connections.</p>

function submitSettings(form) {
  const el = form.elements;
  world.name = el.name.value.trim() || 'Untitled World';
  world.tagline = el.tagline.value.trim();
  world.overview = el.overview.value;
  const lines = s => s.split('\n').map(l => l.trim()).filter(Boolean);
  const monthList = lines(el.months.value).map(l => { const m = l.match(/^(.+?)\s*:\s*(\d+)$/); return m ? { name: m[1].trim(), days: Number(m[2]) } : { name: l, days: 30 }; });
  const holidays = [];
  for (const l of lines(el.holidays.value)) {
    const m = l.match(/^(.+?):\s*(.+?)\s+(\d+)\s*(?:[-–—]\s*(.*))?$/);
    const mi = m ? monthList.findIndex(x => norm(x.name) === norm(m[2])) : -1;
    if (m && mi >= 0) holidays.push({ name: m[1].trim(), month: mi + 1, day: Number(m[3]), note: (m[4] || '').trim() });
    else toast(`Skipped holiday line “${l}”: use Name: Month Day`);
  }
  world.calendar = { suffix: el.suffix.value.trim(), before: el.before.value.trim(), months: monthList, weekdays: el.weekdays.value.split(',').map(s => s.trim()).filter(Boolean), holidays };
  const g = n => $$(`[name=${n}]`, form).map(i => i.value);
  const names = g('era-name'), starts = g('era-start'), ends = g('era-end'), colors = g('era-color');
  world.eras = names.map((name, i) => ({ name: name.trim(), start: isNum(starts[i]) ? Number(starts[i]) : '', end: isNum(ends[i]) ? Number(ends[i]) : '', color: colors[i] }))
    .filter(er => er.name && isNum(er.start)).sort((a, b) => a.start - b.start);
  // Custom types: keep each type's key stable so its entries stay attached.
  const keys = g('ct-key'), icons = g('ct-icon'), sing = g('ct-singular'), labels = g('ct-label'), tcolors = g('ct-color'), tfields = g('ct-fields');
  const next = sing.map((s, i) => {
    if (!s.trim()) return null;
    const prev = world.customTypes.find(c => c.key === keys[i]);
    return { key: keys[i] || 'x_' + slug(s).replace(/-/g, '_') + '_' + Math.random().toString(36).slice(2, 6), singular: s.trim(), label: labels[i].trim() || s.trim() + 's',
      icon: icons[i].trim() || '◆', color: tcolors[i], fields: parseFields(tfields[i], prev?.fields) };
  }).filter(Boolean);
  for (const c of world.customTypes) {
    if (!next.some(n => n.key === c.key) && world.entries.some(e => e.type === c.key)) { next.push(c); alert(`“${c.label}” still has entries, so it was kept. Move or delete its entries first.`); }
  }
  world.customTypes = next;
  const extra = {};
  for (const k of Object.keys(BASE_TYPES)) { const f = parseFields(el['xf-' + k].value, world.extraFields[k]); if (f.length) extra[k] = f; }
  world.extraFields = extra;
  setWorld(world);
  save(); toast('World settings saved'); go('#/home');
}

// ---------- export / import ----------
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const worldJSON = (w = world) => JSON.stringify({ ...w, exported: Date.now() }, null, 2);
function encyclopediaHTML(includeSecrets) {
  const w = structuredClone(world);
  w.trash = [];
  w.entries.forEach(e => { e.history = []; if (!includeSecrets) e.secret = ''; });
  const data = JSON.stringify(w).replace(/</g, '\\u003c');
  const fonts = $('link[data-fonts]').outerHTML;
  return `<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>${esc(w.name)} — Encyclopedia</title>\n${fonts}\n<script id="theme-boot">${$('#theme-boot').textContent}<\/script>\n<style id="style">${$('#style').textContent}</style>\n</head>\n<body class="readonly">\n${SHELL}\n<script>window.__WORLD__ = ${data};<\/script>\n<script id="app-script">${$('#app-script').textContent}<\/script>\n</body>\n</html>\n`;
}
function askSecrets() {
  return world.entries.some(e => e.secret) ? confirm('Include your 🔒 secret notes in the HTML encyclopedia?\n\nOK = include them, Cancel = leave them out (recommended if you will share it).') : false;
}
async function saveToFolder() {
  const base = slug(world.name);
  const secrets = askSecrets();
  if (!window.showDirectoryPicker) {
    alert('Your browser can\'t write to folders directly (Chrome and Edge can). Both files will download instead. Move them into your builder/exports folder.');
    download(base + '.world.json', worldJSON(), 'application/json');
    download(base + '.html', encyclopediaHTML(secrets), 'text/html');
    return;
  }
  try {
    let dir = await store.get('dirHandle');
    if (dir && (await dir.requestPermission({ mode: 'readwrite' })) !== 'granted') dir = null;
    if (!dir || !confirm(`Save into the folder "${dir.name}"?\n\nCancel to choose a different folder.`)) {
      dir = await window.showDirectoryPicker({ id: 'worldbuilder', mode: 'readwrite' });
      try { await store.set('dirHandle', dir); } catch { /* handle not storable in this browser */ }
    }
    for (const [name, text] of [[base + '.world.json', worldJSON()], [base + '.html', encyclopediaHTML(secrets)]]) {
      const fh = await dir.getFileHandle(name, { create: true });
      const wr = await fh.createWritable(); await wr.write(text); await wr.close();
    }
    toast(`Saved ${base}.world.json and ${base}.html to "${dir.name}"`);
  } catch (err) {
    if (err.name !== 'AbortError') alert('Could not save to the folder: ' + err.message);
  }
}
async function importFile(file) {
  try {
    const w = normalize(JSON.parse(await file.text()));
    if (!w) throw new Error('This does not look like a world file.');
    if (lib.some(m => m.id === w.id) && !confirm(`"${w.name}" is already in your library.\n\nOK = replace that copy with this file\nCancel = add this file as a separate copy`)) w.id = uid();
    await flushSave();
    await addWorld(w);
    toast(`Imported ${w.name} (${w.entries.length} entries)`); go('#/home');
  } catch (err) { alert('Import failed: ' + err.message); }
}

function sampleMap() {

  const g = c.getContext('2d');
  g.fillStyle = '#d8cfae'; g.fillRect(0, 0, 1200, 800);

  for (let y = 30; y < 800; y += 34) for (let x = (y % 68) ? 20 : 50; x < 1200; x += 80) { g.beginPath(); g.arc(x, y, 9, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
  const blob = (cx, cy, r, seed) => {
    g.beginPath();
    for (let i = 0; i <= 120; i++) {
      const a = i / 120 * Math.PI * 2, k = 1 + 0.17 * Math.sin(a * 3 + seed) + 0.08 * Math.sin(a * 7 + seed * 2) + 0.05 * Math.sin(a * 13 + seed * 3);
      const x = cx + Math.cos(a) * r * k * 1.4, y = cy + Math.sin(a) * r * k;

    }

// ---------- events ----------
async function onAction(el) {
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'new') go('#/new/' + el.dataset.type);
  else if (act === 'delete') {
    const e = byId(id);
    if (e && confirm(`Delete "${e.title}"? You can restore it from Recently deleted.`)) {
      trashEntry(e); go('#/home');
      toast(`Deleted "${e.title}"`, { label: 'Undo', fn: () => { const r = restoreTrash(world.trash.findIndex(t => t.entry.id === e.id)); if (r) go('#/entry/' + r.id); } });
    }
  }
  else if (act === 'pin') { const e = byId(id); e.pinned = !e.pinned; save(); renderSidebar(); renderEntry(e); }
  else if (act === 'random') {
    const pool = world.entries.filter(e => !(ui.view === 'entry' && e.id === ui.arg));
    if (pool.length) go('#/entry/' + pool[Math.floor(Math.random() * pool.length)].id); else toast('No entries yet');
  }
  else if (act === 'add-row') $('#rels').insertAdjacentHTML('beforeend', relRow());
  else if (act === 'add-era') $('#eras').insertAdjacentHTML('beforeend', eraRow());
  else if (act === 'add-type') $('#ctypes').insertAdjacentHTML('beforeend', typeRow());
  else if (act === 'rm-row') el.parentElement.remove();
  else if (act === 'rm-block') el.closest('.ctype').remove();
  else if (act === 'rm-img') { draft.image = ''; renderImgPreview(); }
  else if (act === 'zoom') { $('#lightbox img').src = el.src; $('#lightbox').classList.add('open'); }
  else if (act === 'g-reset') drawGraph();
  else if (act === 'print') window.print();
  else if (act === 'scroll') document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
  // maps
  else if (act === 'map-add') { ui.mapAdd = !ui.mapAdd; closePinPop(); el.classList.toggle('primary', ui.mapAdd); el.textContent = ui.mapAdd ? '📍 Click the map to place a pin…' : '📍 Add pin'; $('#map-view').classList.toggle('adding', ui.mapAdd); }
  else if (act === 'map-zoom') mapView.zoomBy(Number(el.dataset.k));
  else if (act === 'map-fit') { closePinPop(); mapView.fit(); }
  else if (act === 'map-focus' || act === 'pin-edit') { const e = byId(ui.arg), p = e?.pins.find(x => x.id === el.dataset.pin); if (p) openPinPop(e, p, act === 'pin-edit'); }
  else if (act === 'pin-close') closePinPop();
  else if (act === 'pin-save' || act === 'pin-del') {
    const e = byId(ui.arg), p = e?.pins.find(x => x.id === el.dataset.pin);
    if (!p) return;
    if (act === 'pin-del') e.pins = e.pins.filter(x => x !== p);
    else { p.to = $('#pp-to').value; p.label = $('#pp-label').value.trim(); }
    save(); renderMap(e);
  }
  // politics
  else if (act === 'pol-set') { setPolState(byId(el.dataset.a), byId(el.dataset.b), el.dataset.k); closePolMenu(); renderPolitics(); }
  // stubs
  else if (act === 'stub-create') { const sel = $$('[data-stub-type]').find(s => s.dataset.stubType === el.dataset.title); go(`#/new/${sel?.value || 'lore'}/${encodeURIComponent(el.dataset.title)}`); }
  // history & trash
  else if (act === 'restore-version') { if (confirm('Restore this version? The current one stays in the history.')) restoreVersion(byId(id), Number(el.dataset.i)); }
  else if (act === 'trash-restore') { const e = restoreTrash(Number(el.dataset.i)); if (e) { toast(`Restored "${e.title}"`); go('#/entry/' + e.id); } }
  else if (act === 'trash-purge') { world.trash.splice(Number(el.dataset.i), 1); save(); renderTrash(); }
  else if (act === 'trash-empty') { if (confirm('Permanently delete everything in the bin?')) { world.trash = []; save(); renderTrash(); } }
  // library
  else if (act === 'lib-open') switchWorld(id);
  else if (act === 'lib-new') { await flushSave(); const w = normalize(blankWorld()); await addWorld(w); go('#/settings'); toast('New world created. Give it a name.'); }
  else if (act === 'lib-dup' || act === 'lib-export') {
    await flushSave();
    const w = normalize(await store.get('world:' + id));
    if (!w) return;
    if (act === 'lib-export') { download(slug(w.name) + '.world.json', worldJSON(w), 'application/json'); return; }
    w.id = uid(); w.name += ' (copy)';
    await addWorld(w, false); renderLibrary(); toast('World duplicated');
  }
  else if (act === 'lib-del') {
    const m = lib.find(x => x.id === id);
    if (!m || !confirm(`Delete the world "${m.name}" from this browser? This cannot be undone. Export it first if you want to keep it.`)) return;
    clearTimeout(saveTimer); saveTimer = null;
    await removeWorld(id);
    if (id === world.id) { if (lib.length) await openWorld(lib[0].id); else await addWorld(normalize(blankWorld())); }
    route(); renderLibrary(); toast('World deleted');
  }
  // archive
  else if (act === 'export-json') { download(slug(world.name) + '.world.json', worldJSON(), 'application/json'); toast('World file downloaded. Move it into builder/exports.'); }
  else if (act === 'export-html') { download(slug(world.name) + '.html', encyclopediaHTML(askSecrets()), 'text/html'); toast('Encyclopedia downloaded. Move it into builder/exports.'); }
  else if (act === 'save-folder') saveToFolder();
  else if (act === 'import') $('#import-file').click();
  else if (act === 'sample') {
    await flushSave();
    if (!world.entries.length && world.name === 'Untitled World') await removeWorld(world.id);
    await addWorld(sampleWorld());
    toast('Sample world added to your library'); go('#/home');
  }
}

  else if (t.id === 'tree-pick' && t.value) go('#/tree/' + t.value);
  else if (t.id === 'cal-year' && isNum(t.value)) go('#/calendar/' + Number(t.value));
  else if (t.id === 'book-secrets') { ui.bookSecrets = t.checked; renderBook(); }
});
document.addEventListener('input', ev => { if (ev.target.matches('textarea')) { linkPop.idx = 0; updateLinkPop(ev.target); } });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { closePolMenu(); closePinPop(); hidePreview(); }
  if (!linkPop.el || ev.target !== linkPop.ta) return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    linkPop.idx = (linkPop.idx + (ev.key === 'ArrowDown' ? 1 : -1) + linkPop.items.length) % linkPop.items.length;
    updateLinkPop(ev.target);
  } else if (ev.key === 'Enter' || ev.key === 'Tab') { ev.preventDefault(); pickLink(linkPop.idx); }
  else if (ev.key === 'Escape') closeLinkPop();
});
document.addEventListener('mousedown', ev => {
  const item = ev.target.closest('.link-pop [data-i]');
  if (item) { ev.preventDefault(); pickLink(Number(item.dataset.i)); }
  else if (linkPop.el && !linkPop.el.contains(ev.target)) closeLinkPop();
});
const canHover = matchMedia('(hover: hover)').matches;
document.addEventListener('mouseover', ev => {
  if (!canHover) return;
  const a = ev.target.closest('a[href^="#/entry/"]');
  if (!a || a.closest('.card, .preview') || a.contains(ev.relatedTarget)) return;
  const e = byId(a.getAttribute('href').slice(8));
  if (!e) return;
  clearTimeout(pvTimer);
  pvTimer = setTimeout(() => showPreview(a, e), 300);
});
document.addEventListener('mouseout', ev => {
  const a = ev.target.closest('a[href^="#/entry/"]');
  if (a && !a.contains(ev.relatedTarget)) hidePreview();
});
$('#search').addEventListener('input', ev => { ui.search = ev.target.value; renderSidebar(); });
$('#search').addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { const first = $('.entry-list a'); if (first) location.hash = first.getAttribute('href'); }
});
$('#theme-toggle').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t);
  try { localStorage.setItem('wb:theme', t); } catch { /* storage unavailable: theme lasts for this visit */ }
});
$('#menu-toggle').addEventListener('click', () => $('#app').classList.toggle('side-open'));
$('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('open'));
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', () => { if (saveTimer) writeNow(); });

(async function init() {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
  if (READONLY) {
    document.body.classList.add('readonly');
    setWorld(normalize(window.__WORLD__) || blankWorld());
  } else {
    await loadLibrary();
    const cur = await store.get('current');
    if (!(cur && await openWorld(cur)) && !(lib[0] && await openWorld(lib[0].id))) await addWorld(normalize(blankWorld()));
  }
  route();
})();
</script>
